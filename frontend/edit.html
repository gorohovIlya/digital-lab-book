<!--Страница редактирования эксперимента-->
<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторный журнал</title>
  </head>
  <body>
    <header>
      <div class="department-name dev">Наименование подразделения</div>
      <div class="info-table dev">
        <div class="info-table-item dev">
          <div class="label-div dev">
            <label for="datetime">Дата:</label>
          </div>
          <div class="text-div dev">
            <input type="text" id="datetime" name="datetime">
          </div>
        </div>
        <div class="info-table-item dev">
          <div class="label-div">
            <label for="project-name">Наименование проекта:</label>
          </div>
          <div class="text-div dev">
            <input type="text" id="project-name" name="project-name">
          </div>
        </div>
        <div class="info-table-item dev">
          <div class="label-div dev">
            <label for="exp-num">Номер эксперимента:</label>
          </div>
          <div class="text-div dev dev">
            <input type="text" id="exp-num" name="exp-num">
          </div>
        </div>
        <div class="info-table-item dev">
          <div class="label-div dev">
            <label for="exp-comment">Комментарий:</label>
          </div>
          <div class="text-div dev">
            <textarea id="exp-comment" name="exp-comment" rows="7" cols="4"></textarea>
          </div>
        </div>
        <div class="info-table-item dev">
          <div class="label-div dev">
            <label for="exp-goal">Цель эксперимента:</label>
          </div>
          <div class="text-div dev">
            <textarea id="exp-goal" name="exp-goal" rows="7" cols="4"></textarea>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div class="substances-table dev">
        <div class="substances-table-header dev">
          Заголовок таблицы
        </div>
      </div>
    </main>
  </body>
</html>
