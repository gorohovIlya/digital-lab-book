<!--Страница редактирования эксперимента-->
<!DOCTYPE html>
<html lang="">
  <head>
    <meta charset="UTF-8">
    <link rel="icon" href="/favicon.ico">
    <link rel="stylesheet" href="style.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Редактирование</title>
  </head>
  <body>
    <nav>
        <div class="department-name dev">Наименование подразделения</div>
    </nav>
    <header>
      <div class="info-table dev">
        <div class="info-table-item dev">
          <div class="label-div dev">
            <label for="datetime">Дата:</label>
          </div>
          <div class="text-div dev">
            <input type="text" id="datetime" name="datetime">
          </div>
        </div>
        <div class="info-table-item dev">
          <div class="label-div">
            <label for="project-name">Наименование проекта:</label>
          </div>
          <div class="text-div dev">
            <input type="text" id="project-name" name="project-name">
          </div>
        </div>
        <div class="info-table-item dev">
          <div class="label-div dev">
            <label for="exp-num">Номер эксперимента:</label>
          </div>
          <div class="text-div dev dev">
            <input type="text" id="exp-num" name="exp-num">
          </div>
        </div>
        <div class="info-table-item dev">
          <div class="label-div dev">
            <label for="exp-comment">Комментарий:</label>
          </div>
          <div class="text-div dev">
            <textarea id="exp-comment" name="exp-comment" rows="7" cols="4"></textarea>
          </div>
        </div>
        <div class="info-table-item dev">
          <div class="label-div dev">
            <label for="exp-goal">Цель эксперимента:</label>
          </div>
          <div class="text-div dev">
            <textarea id="exp-goal" name="exp-goal" rows="7" cols="4"></textarea>
          </div>
        </div>
      </div>
    </header>
    <main>
      <div class="substances-table dev">
        <div class="substances-table-header dev">
          <div class="cell dev">
            Вещество
          </div>
          <div class="cell dev">
            CAS-Номер
          </div>
          <div class="cell dev">
            Кол-во Вещества
          </div>
          <div class="cell dev">
            Молярная масса
          </div>
          <div class="cell dev">
            Масса
          </div>
          <div class="cell dev">
            Плотность
          </div>
          <div class="cell dev">
            Объем
          </div>
        </div>
      </div>
      <div class="methodic dev">
          <div class="methodic-header dev">
              Методика *назв. вещества*
          </div>
          <div class="methodic-chemdraw-embedded dev">
              chemdraw встройка
          </div>
          <div class="methodic-substances-table dev">
              В-во 1
          </div>
      </div>
      <div class="products-table dev">
          <div class="products-table-header dev">
              <div class="products-table-header-item dev">
                  Продукты
              </div>
              <div class="products-table-header-item dev">
                  Масса
              </div>
              <div class="products-table-header-item dev">
                  Объем
              </div>
          </div>
      </div>
      <div class="control-panel dev">
          <div class="button save dev">Сохранить</div>
          <div class="button exit dev">Выйти</div>
      </div>
    </main>
  </body>
</html>
